<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family apps</title>
  <style>
    body { margin:0; min-height:100dvh; background:#1b1814; color:#f4efe6; font-family:Georgia,serif; }
    main { max-width:40rem; margin:0 auto; padding:3rem 1.25rem; }
    p.k { letter-spacing:.2em; text-transform:uppercase; font-family:system-ui; font-size:11px; color:#b7aa96; }
    h1 { font-weight:500; font-size:2.4rem; margin:.3rem 0 1.5rem; }
    a { display:block; text-decoration:none; color:inherit; border-radius:20px; padding:1.25rem 1.4rem; margin:0 0 .85rem; }
    a.lilly { background:#fff6eb; color:#3d2c2a; }
    a.aiden { background:#1f2a20; color:#e8b14a; }
    a.hearth { background:#f4efe6; color:#2a241c; }
    strong { display:block; font-size:1.5rem; }
    span { display:block; margin-top:.25rem; font-family:system-ui; font-size:.9rem; opacity:.75; }
  </style>
</head>
<body>
  <main>
    <p class="k">Three separate homes</p>
    <h1>Who is this for?</h1>
    <a class="lilly" href="lilly/"><strong>Lilly</strong><span>Sparkle Time — playroom for a three-year-old</span></a>
    <a class="aiden" href="aiden/"><strong>Aiden</strong><span>Hero Block Academy — build and learn, no fighting</span></a>
    <a class="hearth" href="hearth/"><strong>Hearth</strong><span>Her weight plan, list, meals, walk, and quiet tools</span></a>
  </main>
</body>
</html>
