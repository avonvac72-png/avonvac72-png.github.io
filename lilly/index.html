<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sparkle Time" />
  <meta name="theme-color" content="#fff6eb" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  <title>Sparkle Time</title>
  <style>
    :root { --paper:#fff6eb; --ink:#3d2c2a; --muted:#8a6f68; --surface:#fffdf9; --line:#ead6c4; --sun:#f0c14b; --sky:#4fb7c8; --leaf:#5eae6d; --rose:#e8899a; --coral:#e85d4c; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:Fredoka,ui-rounded,sans-serif; }
    button { cursor:pointer; font:inherit; color:inherit; }
    header { display:flex; justify-content:space-between; align-items:center; padding:max(12px,env(safe-area-inset-top)) 16px 10px; }
    .brand { display:flex; gap:10px; align-items:center; border:0; background:none; padding:0; }
    .brand img { width:52px; height:52px; border-radius:50%; object-fit:cover; }
    .chip { background:var(--sun); border-radius:999px; padding:8px 14px; font-weight:700; }
    .home-btn { width:56px; height:56px; border:0; border-radius:50%; background:var(--sky); color:#fff; font-size:24px; }
    main { padding:8px 16px 28px; max-width:520px; margin:0 auto; }
    .stage { background:linear-gradient(#bfeaf3,#ffe3c4); border-radius:32px; padding:16px; text-align:center; }
    .mascot { width:180px; border-radius:50%; margin:8px auto; display:block; animation:bob 2.4s ease-in-out infinite; }
    .mascot.giggle { animation:giggle .55s ease; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .card { border:0; border-radius:20px; min-height:64px; font-weight:700; font-size:18px; color:#fff; }
    .hidden { display:none !important; }
    .bubbles { position:relative; height:62vh; background:linear-gradient(#7ec8e3,#dff4ff); border-radius:28px; overflow:hidden; }
    .bubble { position:absolute; border-radius:50%; border:0; animation:rise 7s linear forwards; }
    .garden { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; background:#7cae5a; padding:14px; border-radius:28px; }
    .dirt { aspect-ratio:1; border:0; border-radius:18px; background:#6a8f42; font-size:40px; }
    .doors { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .door { min-height:120px; border:0; border-radius:20px; font-weight:800; font-size:28px; background:#8b5a3c; color:#fff; }
    .palette { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .swatch { aspect-ratio:1; border-radius:50%; border:6px solid #fff; }
    .friends { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .friend { min-height:88px; border:0; border-radius:20px; font-weight:700; }
    .piano { display:flex; height:150px; gap:4px; }
    .pkey { flex:1; border:0; background:#fff; border-radius:0 0 12px 12px; font-weight:800; }
    .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
    .tab { border:0; background:#fff; border-radius:14px; padding:10px 4px; font-weight:700; }
    .tab.on { background:var(--ink); color:#fff; }
    .drums { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .drum { min-height:90px; border:0; border-radius:999px; font-weight:800; color:#fff; }
    canvas { width:100%; height:280px; background:#fff; border-radius:24px; touch-action:none; }
    .crayons { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:10px; }
    .crayon { width:40px; height:40px; border-radius:50%; border:4px solid #fff; }
    .row { display:flex; justify-content:center; gap:10px; margin-top:12px; }
    .btn { background:var(--ink); color:#fff; border:0; border-radius:16px; padding:12px 18px; font-weight:700; }
    .sheet { position:fixed; inset:0; background:#3d2c2a66; display:flex; align-items:flex-end; padding:16px; }
    .panel { background:#fff; border-radius:24px; padding:20px; width:100%; }
    @keyframes bob { 50% { transform:translateY(-10px); } }
    @keyframes giggle { 25% { transform:rotate(-8deg) scale(1.06);} 75% { transform:rotate(8deg) scale(1.06);} }
    @keyframes rise { to { transform:translateY(-70vh); opacity:.2; } }
  </style>
</head>
<body>
  <header>
    <button class="brand" id="mascotBtn"><img src="art/mascot.jpg" alt=""><div><b>Sparkle Time</b><div id="hello">Hi, Lilly!</div></div></button>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="chip">★ <span id="stars">0</span></div>
      <button class="home-btn" id="homeBtn" hidden>⌂</button>
    </div>
  </header>
  <main>
    <section id="home"></section>
    <section id="play" class="hidden"><h1 id="playTitle"></h1><div id="playBody"></div></section>
  </main>
  <div id="sheet" class="sheet hidden"><div class="panel"><h2>Grown-ups</h2><label>Name<input id="nameIn" value="Lilly" /></label><label style="display:flex;justify-content:space-between;margin:12px 0">Voice <input id="voiceIn" type="checkbox" checked></label><button class="btn" id="closeSheet">Done</button></div></div>
<script>
const store = JSON.parse(localStorage.getItem("sparkle-fun")||'{"stars":0,"name":"Lilly","voice":true,"awarded":[]}');
function save(){ localStorage.setItem("sparkle-fun", JSON.stringify(store)); }
function speak(t){ if(!store.voice||!speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.94; u.pitch=.95; const vs=speechSynthesis.getVoices(); const v=vs.find(x=>/Daniel|en-GB|Samantha|Google/i.test(x.name+' '+x.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }
function award(k){ if(store.awarded.includes(k)) return; store.awarded.push(k); store.stars++; save(); document.getElementById("stars").textContent=store.stars; }
let actx; function tone(f,d=.4,type="sine"){ try{ actx=actx||new (AudioContext||webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); const o=actx.createOscillator(),g=actx.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(.25,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
const LINES=["Hi Lilly!","That tickles!","Again, again!","I love you!","Let's play!","Whee!"];
const GAMES=[["bubbles","🫧 Bubbles","#4fb7c8"],["garden","🌸 Garden","#5eae6d"],["dress","👗 Dress-up","#e8899a"],["peek","🚪 Peekaboo","#f0c14b"],["colors","🌈 Rainbow","#e85d4c"],["animals","🐾 Friends","#ffb48a"],["music","🎵 Band","#8d6bb3"],["draw","🖍️ Scribble","#f0c14b"]];
const ANIMALS=[["Puppy","woof","🐶","#ffb48a"],["Kitty","meow","🐱","#f0c14b"],["Duck","quack","🦆","#4fb7c8"],["Bunny","hop","🐰","#e8899a"],["Froggy","ribbit","🐸","#5eae6d"],["Owl","hoo","🦉","#8d6bb3"]];
function home(){
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("play").classList.add("hidden");
  document.getElementById("homeBtn").hidden=true;
  const el=document.getElementById("home");
  el.innerHTML=`<div class="stage"><p id="line">Hi, ${store.name}! Tickle me!</p><img class="mascot" id="sparkle" src="art/mascot.jpg" alt=""><p>Tickle Sparkle, then pick a game</p><div class="grid" id="menu"></div></div>`;
  document.getElementById("sparkle").onclick=()=>{
    const t=LINES[Math.floor(Math.random()*LINES.length)];
    document.getElementById("line").textContent=t; speak(t); award("tickle");
    const m=document.getElementById("sparkle"); m.classList.add("giggle"); setTimeout(()=>m.classList.remove("giggle"),550);
  };
  GAMES.forEach(([id,label,c])=>{
    const b=document.createElement("button"); b.className="card"; b.style.background=c; b.textContent=label; b.onclick=()=>open(id,label); document.getElementById("menu").appendChild(b);
  });
}
function open(id,title){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("play").classList.remove("hidden");
  document.getElementById("homeBtn").hidden=false;
  document.getElementById("playTitle").textContent=title.replace(/^[^\s]+\s/,"");
  const el=document.getElementById("playBody"); el.innerHTML="";
  speak(title); builders[id](el);
}
const builders={
  bubbles(el){
    el.className="bubbles";
    const colors=["#4fb7c8","#e8899a","#f0c14b","#8d6bb3"];
    function spawn(){
      const b=document.createElement("button"); b.className="bubble";
      const s=70+Math.random()*50; b.style.width=s+"px"; b.style.height=s+"px";
      b.style.left=(8+Math.random()*75)+"%"; b.style.bottom="0";
      b.style.background=`radial-gradient(circle at 30% 30%,#fff,${colors[Math.floor(Math.random()*4)]})`;
      b.onpointerdown=()=>{tone(600+Math.random()*400,.3); speak("pop"); award("bubble"); b.remove();};
      el.appendChild(b); setTimeout(()=>b.remove(),7000);
    }
    spawn(); spawn(); const t=setInterval(spawn,900); el.dataset.t=t;
  },
  garden(el){
    el.className="garden";
    const fl=["🌸","🌼","🌷","🌺","🌻","💐"];
    for(let i=0;i<9;i++){ const b=document.createElement("button"); b.className="dirt"; b.textContent="·";
      b.onclick=()=>{ b.textContent=fl[Math.floor(Math.random()*fl.length)]; tone(360+i*30,.3); speak("A flower!"); award("g"+i); };
      el.appendChild(b); }
  },
  dress(el){
    el.style.textAlign="center";
    const hats=["🎀","👑","🎩","🌸","⭐"]; let i=0;
    el.innerHTML=`<p>Tap the hat</p><div id="hat" style="font-size:48px">🎀</div><img src="art/mascot.jpg" style="width:180px;border-radius:50%">`;
    el.querySelector("#hat").onclick=()=>{ i=(i+1)%hats.length; el.querySelector("#hat").textContent=hats[i]; speak("Ooh"); award("dress"); };
  },
  peek(el){
    el.className="doors";
    ANIMALS.forEach(([n,s,f,c])=>{
      const b=document.createElement("button"); b.className="door"; b.textContent="?";
      b.onclick=()=>{ if(b.textContent==="?"){ b.textContent=f; b.style.background=c; speak("Peekaboo! "+n+" says "+s); award("p"+n);} else { b.textContent="?"; b.style.background="#8b5a3c"; } };
      el.appendChild(b);
    });
  },
  colors(el){
    el.className="palette";
    [["Red","#e85d4c"],["Orange","#ef8a3c"],["Yellow","#f0c14b"],["Green","#5eae6d"],["Blue","#4a9fe0"],["Purple","#8d6bb3"],["Pink","#e8899a"],["White","#fff"]].forEach(([n,c])=>{
      const b=document.createElement("button"); b.className="swatch"; b.style.background=c;
      b.onclick=()=>{ speak(n+"!"); document.body.style.background=c; setTimeout(()=>document.body.style.background="",500); award("c"+n); };
      el.appendChild(b);
    });
  },
  animals(el){
    el.className="friends";
    ANIMALS.forEach(([n,s,f,c])=>{
      const b=document.createElement("button"); b.className="friend"; b.style.background=c; b.textContent=f+" "+n;
      b.onclick=()=>{ speak(n+" says "+s+"!"); award("a"+n); }; el.appendChild(b);
    });
  },
  music(el){
    const tabs=document.createElement("div"); tabs.className="tabs";
    const stage=document.createElement("div");
    function piano(){ stage.innerHTML=""; const row=document.createElement("div"); row.className="piano";
      [["C",261],["D",293],["E",329],["F",349],["G",392],["A",440],["B",493],["C",523]].forEach(([n,f])=>{
        const b=document.createElement("button"); b.className="pkey"; b.textContent=n;
        b.onpointerdown=e=>{e.preventDefault(); tone(f,.6,"triangle"); speak(n); award("piano");}; row.appendChild(b);
      }); stage.appendChild(row); }
    function drums(){ stage.innerHTML=""; const row=document.createElement("div"); row.className="drums";
      [["Boom",90,"#3d2c2a"],["Thump",140,"#e85d4c"],["Tap",280,"#f0c14b"],["Click",520,"#4fb7c8"]].forEach(([n,f,c])=>{
        const b=document.createElement("button"); b.className="drum"; b.style.background=c; b.textContent=n;
        b.onpointerdown=e=>{e.preventDefault(); tone(f,.25); speak(n); award("drum");}; row.appendChild(b);
      }); stage.appendChild(row); }
    [["Piano",piano],["Drums",drums]].forEach(([n,fn],i)=>{
      const t=document.createElement("button"); t.className="tab"+(i===0?" on":""); t.textContent=n; t.onclick=()=>{ [...tabs.children].forEach(x=>x.classList.remove("on")); t.classList.add("on"); fn(); }; tabs.appendChild(t);
    });
    el.append(tabs,stage); piano();
  },
  draw(el){
    const cray=document.createElement("div"); cray.className="crayons";
    const canvas=document.createElement("canvas");
    let color="#e85d4c";
    ["#e85d4c","#ef8a3c","#f0c14b","#5eae6d","#4fb7c8","#8d6bb3","#3d2c2a"].forEach((c,i)=>{
      const b=document.createElement("button"); b.className="crayon"; b.style.background=c; if(!i) b.style.outline="3px solid #3d2c2a";
      b.onclick=()=>{ color=c; cray.querySelectorAll(".crayon").forEach(x=>x.style.outline=""); b.style.outline="3px solid #3d2c2a"; };
      cray.appendChild(b);
    });
    el.append(cray,canvas);
    requestAnimationFrame(()=>{ const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1; canvas.width=r.width*d; canvas.height=r.height*d; const ctx=canvas.getContext("2d"); ctx.setTransform(d,0,0,d,0,0); ctx.lineCap="round"; ctx.lineWidth=16;
      let draw=false,last=null;
      canvas.onpointerdown=e=>{ draw=true; last=[e.clientX-r.left,e.clientY-r.top]; award("draw"); };
      canvas.onpointermove=e=>{ if(!draw) return; const p=[e.clientX-canvas.getBoundingClientRect().left,e.clientY-canvas.getBoundingClientRect().top]; ctx.strokeStyle=color; ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; };
      canvas.onpointerup=()=>draw=false;
    });
  }
};
document.getElementById("homeBtn").onclick=()=>{ speak("Home sweet home"); home(); };
let hold;
document.getElementById("mascotBtn").onpointerdown=()=>{ hold=setTimeout(()=>{ document.getElementById("sheet").classList.remove("hidden"); },1600); };
document.getElementById("mascotBtn").onpointerup=()=>clearTimeout(hold);
document.getElementById("closeSheet").onclick=()=>{ store.name=document.getElementById("nameIn").value||"Lilly"; store.voice=document.getElementById("voiceIn").checked; save(); document.getElementById("sheet").classList.add("hidden"); home(); };
document.getElementById("stars").textContent=store.stars;
home();
speak("Hi Lilly! Tickle me!");
</script>
</body>
</html>
