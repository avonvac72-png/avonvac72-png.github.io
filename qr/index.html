<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family app codes</title>
  <style>
    body { margin: 0; background: #f4efe6; color: #2a241c; font-family: Georgia, serif; }
    main { max-width: 28rem; margin: 0 auto; padding: 2rem 1.2rem 3rem; }
    h1 { font-weight: 500; font-size: 2rem; margin: 0 0 .4rem; }
    p { font-family: system-ui, sans-serif; line-height: 1.45; color: #5c564c; }
    article { background: #fff; border-radius: 24px; padding: 1.2rem; margin: 1rem 0; text-align: center; }
    img { width: min(100%, 280px); height: auto; background: #fff; }
    h2 { margin: .6rem 0 .2rem; font-size: 1.4rem; }
    a { color: #2a241c; word-break: break-all; font-family: system-ui, sans-serif; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Scan these</h1>
    <p>Open the camera on the iPad or phone. Point it at a square. Tap the banner that appears.</p>

    <article>
      <img src="lilly.png" alt="QR for Lilly" width="280" height="280" />
      <h2>Lilly</h2>
      <a href="https://avonvac72-png.github.io/lilly/">avonvac72-png.github.io/lilly</a>
    </article>
    <article>
      <img src="aiden.png" alt="QR for Aiden" width="280" height="280" />
      <h2>Aiden</h2>
      <a href="https://avonvac72-png.github.io/aiden/">avonvac72-png.github.io/aiden</a>
    </article>
    <article>
      <img src="hearth.png" alt="QR for Irene" width="280" height="280" />
      <h2>Irene</h2>
      <a href="https://avonvac72-png.github.io/hearth/">avonvac72-png.github.io/hearth</a>
    </article>
  </main>
</body>
</html>
